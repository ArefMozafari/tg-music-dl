[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "tg-music-dl"
version = "0.1.0"
description = "Download music from Telegram channels."
requires-python = ">=3.10"
dependencies = [
    "telethon>=1.42,<2",
    "python-socks[asyncio]>=2.4",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
tg-music-dl = "tg_music_dl.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
